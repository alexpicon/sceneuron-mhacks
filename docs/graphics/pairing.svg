<text x="354" y="315" fill="#f2f0ed" font-size="23" font-weight="700" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">Deck app</text>
<text x="354" y="354" fill="#b9b2c2" font-size="16" font-weight="400" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">Trades the code</text>
<text x="354" y="379" fill="#b9b2c2" font-size="16" font-weight="400" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">on loopback</text>
<rect x="614" y="215" width="252" height="285" rx="19" fill="url(#card)" stroke="#4b4254" filter="url(#shadow)"/>
<rect x="632" y="232" width="45" height="4" rx="2" fill="#78c5da" stroke="none" />
<text x="634" y="273" fill="#78c5da" font-size="15" font-weight="700" letter-spacing="2.5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">03</text>
<text x="634" y="315" fill="#f2f0ed" font-size="23" font-weight="700" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">Control token</text>
<text x="634" y="354" fill="#b9b2c2" font-size="16" font-weight="400" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">Stored by the local</text>
<text x="634" y="379" fill="#b9b2c2" font-size="16" font-weight="400" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">plugin only</text>
<rect x="894" y="215" width="252" height="285" rx="19" fill="url(#card)" stroke="#4b4254" filter="url(#shadow)"/>
