<text x="914" y="273" fill="#71d8a5" font-size="15" font-weight="700" letter-spacing="2.5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">04</text>
<text x="914" y="315" fill="#f2f0ed" font-size="23" font-weight="700" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">Live keys</text>
<text x="914" y="354" fill="#b9b2c2" font-size="16" font-weight="400" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">Raise cards and</text>
<text x="914" y="379" fill="#b9b2c2" font-size="16" font-weight="400" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">follow events</text>
<rect x="54" y="541" width="1092" height="39" rx="12" fill="#242129" stroke="#4b4254" /><text x="73" y="566" fill="#d6a76c" font-size="15" font-weight="600" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">Revocation ends old streams and requires a fresh pair.</text>
