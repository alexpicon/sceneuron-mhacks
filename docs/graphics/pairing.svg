<text x="78" y="108" fill="#f2f0ed" font-size="38" font-weight="750" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">Pair without sharing editor access</text>
<text x="80" y="143" fill="#b9b2c2" font-size="17" font-weight="400" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">A one-time code becomes a limited local control token.</text>
